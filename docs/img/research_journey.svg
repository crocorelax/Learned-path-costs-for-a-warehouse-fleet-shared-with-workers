<svg xmlns="http://www.w3.org/2000/svg" width="940" height="666" viewBox="0 0 940 666" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Research journey, 9 to 30 October 2026" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x="1" y="1" width="938" height="664" rx="12" fill="#ffffff" stroke="#d8dde4"/><line x1="118" y1="66" x2="118" y2="630" stroke="#c5ccd6" stroke-width="2"/><rect x="134" y="28" width="780" height="26" rx="6" fill="#eef1f5"/><text x="146" y="45" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#5b6b80">EXPLORE THE FIELD</text><text x="92" y="70" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">9 Oct</text><circle cx="118" cy="66" r="5.5" fill="#5b6b80"/><text x="140" y="70" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#5b6b80">Assignment from Prof. Ghofrani</tspan>  map the field of multi-robot systems through 30 theses</text><text x="92" y="100" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">10 Oct</text><circle cx="118" cy="96" r="5.5" fill="#5b6b80"/><text x="140" y="100" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#5b6b80">Basics and 20 papers read in depth</tspan>  case chosen: a few small robots planned by a central robot</text><rect x="134" y="142" width="780" height="26" rx="6" fill="#e8f0fb"/><text x="146" y="159" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#2f6db5">SIX LITERATURE SEARCHES</text><text x="92" y="184" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">12 Oct</text><circle cx="118" cy="180" r="5.5" fill="#2f6db5"/><text x="140" y="184" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 1</tspan>  What already exists to plan a small team led by a main robot?</text><text x="140" y="203" font-size="12.5" fill="#5d6878">5,888 hits → 25 papers · kept: assignment and path finding algorithms (CBS, LaCAM, SIPP, ORCA)</text><text x="92" y="232" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">15 Oct</text><circle cx="118" cy="228" r="5.5" fill="#2f6db5"/><text x="140" y="232" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 2</tspan>  Does anyone already decide how much autonomy the small robots get?</text><text x="140" y="251" font-size="12.5" fill="#5d6878">2,945 hits → 25 papers · found: nobody varies autonomy; central control with prediction already works</text><circle cx="118" cy="276" r="3" fill="#2f6db5"/><text x="140" y="280" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 3</tspan>  Do overhead camera control, prediction and corridor choice already exist?</text><text x="140" y="299" font-size="12.5" fill="#5d6878">12 reference works · all exist separately; missing: planning the whole team ahead from predictions</text><text x="92" y="328" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">16 Oct</text><circle cx="118" cy="324" r="5.5" fill="#2f6db5"/><text x="140" y="328" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Turning point</tspan>  the question must be generic; the competition becomes a testbed only</text><text x="92" y="358" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">17 Oct</text><circle cx="118" cy="354" r="5.5" fill="#2f6db5"/><text x="140" y="358" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 4</tspan>  How can a central fleet see people and plan around them?</text><text x="140" y="377" font-size="12.5" fill="#5d6878">3,018 records → 44 papers · kept: Petković et al., who predict workers live but stop the whole fleet</text><text x="92" y="406" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">18 Oct</text><circle cx="118" cy="402" r="5.5" fill="#2f6db5"/><text x="140" y="406" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 5</tspan>  Does live replanning around people already exist?</text><text x="140" y="425" font-size="12.5" fill="#5d6878">kept: the REMROC benchmark; replanning often absorbs delays caused by people better than one plan</text><text x="92" y="454" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">24 Oct</text><circle cx="118" cy="450" r="5.5" fill="#2f6db5"/><text x="140" y="454" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#2f6db5">Search 6</tspan>  How do real warehouses treat people on the robot floor?</text><text x="140" y="473" font-size="12.5" fill="#5d6878">Amazon, Ocado, Locus: robots mostly slow down or stop on their own; the fleet rarely plans ahead</text><rect x="134" y="514" width="780" height="26" rx="6" fill="#e3f4ed"/><text x="146" y="531" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#1f8a6a">CONVERGE ON ONE QUESTION</text><text x="92" y="556" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">26 Oct</text><circle cx="118" cy="552" r="5.5" fill="#1f8a6a"/><text x="140" y="556" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#1f8a6a">The idea</tspan>  a network sets path costs from predicted workers</text><text x="140" y="575" font-size="12.5" fill="#5d6878">research base on three papers: Online GGO, FA-MAPF and Petković et al.</text><text x="92" y="604" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">29 Oct</text><circle cx="118" cy="600" r="5.5" fill="#1f8a6a"/><text x="140" y="604" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#1f8a6a">Novelty check</tspan>  no paper combines PIBT or learned path costs with workers</text><text x="92" y="634" font-size="13.5" font-weight="700" text-anchor="end" fill="#17202b">30 Oct</text><circle cx="118" cy="630" r="5.5" fill="#1f8a6a"/><text x="140" y="634" font-size="13.5" fill="#17202b"><tspan font-weight="700" fill="#1f8a6a">Approved</tspan>  Prof. Ghofrani approves the direction</text></svg>